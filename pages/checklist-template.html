<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<title>{{TITLE}}</title>

<!-- /SAI:FONTS -->
<!-- SAI:KIT -->
<style>
/* The Stephens AI design system (Lens), inlined with its comments removed.
   Replace this block and the SAI:JS block with your own styles to rebrand the page. */
:root {
  --sai-ink:       #171310;
  --sai-ink-90:    #241E19;
  --sai-ink-2:     #6E6258;
  --sai-cream:     #F5F1E8;
  --sai-cream-2:   #B3AB9E;
  --sai-accent:        #DC6843;
  --sai-accent-deep:   #C55532;
  --sai-accent-night:  #FF8E76;
  --sai-accent-soft:   rgba(220,104,67,0.08);
  --sai-accent-line:   rgba(220,104,67,0.18);
  --sai-salmon:        #F47B6B;
  --sai-sky: linear-gradient(180deg, #F3EEE8 0%, #F7E7DA 42%, #F7DCC9 74%, #F2CFB8 100%);
  --sai-sky-fallback: #F5E9DE;
  --sai-night: radial-gradient(130% 130% at 22% -12%, #241B15 0%, #150F0B 58%, #0D0A08 100%);
  --sai-night-fallback: #100C0E;
  --sai-tint-1: #DC6843;
  --sai-tint-2: #F47B6B;
  --sai-tint-3: #A8988A;
  --sai-glass:        rgba(255,255,255,0.55);
  --sai-glass-strong: rgba(255,255,255,0.78);
  --sai-glass-tile:   rgba(255,255,255,0.48);
  --sai-glass-edge:   rgba(255,255,255,0.85);
  --sai-glass-blur:   30px;
  --sai-glass-saturate: 1.5;
  --sai-pane-shadow: 0 14px 44px rgba(112,62,40,0.13),
                     inset 0 1px 0 rgba(255,255,255,0.95),
                     inset 0 -1px 0 rgba(23,19,16,0.04);
  --sai-pane-shadow-hover: 0 22px 56px rgba(112,62,40,0.19),
                     inset 0 1px 0 rgba(255,255,255,0.95),
                     inset 0 -1px 0 rgba(23,19,16,0.04);
  --sai-float-shadow: 0 24px 54px rgba(112,62,40,0.22), inset 0 1px 0 #fff;
  --sai-nglass:       rgba(255,255,255,0.065);
  --sai-nglass-tile:  rgba(255,255,255,0.035);
  --sai-nglass-edge:  rgba(255,255,255,0.12);
  --sai-nrule:        rgba(255,255,255,0.11);
  --sai-nrule-soft:   rgba(255,255,255,0.06);
  --sai-npane-shadow: 0 24px 60px rgba(40,20,10,0.35), inset 0 1px 0 rgba(255,255,255,0.10);
  --sai-daysheet:     rgba(250,247,241,0.96);
  --sai-status-good:        #2E7A56;  --sai-status-good-tint:  rgba(46,122,86,0.12);
  --sai-status-warn:        #946A12;  --sai-status-warn-tint:  rgba(176,130,40,0.16);
  --sai-status-bad:         #B23A2F;  --sai-status-bad-tint:   rgba(178,58,47,0.10);
  --sai-status-good-night:  #7BD8A8;  --sai-status-good-night-tint: rgba(75,214,151,0.13);
  --sai-status-warn-night:  #E4BC66;  --sai-status-warn-night-tint: rgba(200,155,60,0.15);
  --sai-status-bad-night:   #F09A8E;  --sai-status-bad-night-tint:  rgba(210,95,80,0.16);
  --sai-rule:        rgba(23,19,16,0.10);
  --sai-rule-soft:   rgba(23,19,16,0.06);
  --sai-rule-strong: rgba(23,19,16,0.16);
  --sai-hollow:      rgba(23,19,16,0.035);
  --sai-font-sans:  'Inter Tight', 'Helvetica Neue', Arial, sans-serif;
  --sai-font-label: 'Schibsted Grotesk', 'Inter Tight', sans-serif;
  --sai-fs-display: clamp(38px, 5vw, 58px);
  --sai-fs-h1:      clamp(34px, 4.6vw, 48px);
  --sai-fs-h2:      24px;
  --sai-fs-h3:      18.5px;
  --sai-fs-stat:    44px;
  --sai-fs-body:    17px;
  --sai-fs-sub:     15.5px;
  --sai-fs-label:   14.5px;
  --sai-fs-small:   15px;
  --sai-fs-micro:   13px;
  --sai-lh-display: 1.02;
  --sai-lh-heading: 1.05;
  --sai-lh-body:    1.55;
  --sai-ls-display: -0.032em;
  --sai-ls-heading: -0.02em;
  --sai-ls-label:    0.05em;
  --sai-fw-regular: 400;
  --sai-fw-medium:  500;
  --sai-fw-bold:    600;
  --sai-fw-label:   600;
  --sai-fw-numeral: 700;
  --sai-radius-chip:   8px;
  --sai-radius-flag:   10px;
  --sai-radius-tile:   18px;
  --sai-radius-card:   22px;
  --sai-radius-panel:  26px;
  --sai-radius-window: 30px;
  --sai-radius-pill:   999px;
  --sai-space-1: 4px;  --sai-space-2: 8px;   --sai-space-3: 12px; --sai-space-4: 16px;
  --sai-space-5: 24px; --sai-space-6: 32px;  --sai-space-7: 48px; --sai-space-8: 64px;
  --sai-ease:      cubic-bezier(0.2, 0.8, 0.2, 1);
  --sai-dur-fast:  150ms;
  --sai-dur-base:  220ms;
  --sai-dur-slow:  350ms;
  --sai-drift:     16s;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: var(--sai-sky-fallback);
  color: var(--sai-ink);
  font-family: var(--sai-font-sans);
  font-size: var(--sai-fs-body);
  line-height: var(--sai-lh-body);
  overflow-x: clip;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.sai-scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: var(--sai-sky); }
.sai-tint { position: absolute; border-radius: 50%; filter: blur(100px); }
.sai-tint.t1 { width: 600px; height: 600px; background: var(--sai-tint-1); opacity: .10; top: -200px; right: -160px; }
.sai-tint.t2 { width: 520px; height: 520px; background: var(--sai-tint-2); opacity: .12; top: 36%; left: -200px; }
.sai-tint.t3 { width: 620px; height: 620px; background: var(--sai-tint-3); opacity: .12; bottom: -260px; right: 22%; }
.sai-lens {
  position: absolute; border-radius: 50%; pointer-events: none;
  background:
    radial-gradient(circle at 30% 24%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.30) 14%, rgba(255,255,255,0.05) 38%, transparent 60%),
    radial-gradient(circle at 50% 88%, rgba(220,104,67,0.28) 0%, rgba(220,104,67,0.08) 34%, transparent 55%),
    radial-gradient(circle at 50% 115%, rgba(243,206,184,0.55) 0%, transparent 52%),
    radial-gradient(circle at 50% 50%, transparent 58%, rgba(255,255,255,0.16) 88%, rgba(255,255,255,0.42) 99%);
  border: 1px solid rgba(255,255,255,0.55);
  box-shadow:
    inset -10px -14px 30px rgba(220,104,67,0.13),
    inset 8px 12px 26px rgba(255,255,255,0.38),
    0 26px 52px rgba(112,62,40,0.14);
  animation: sai-drift var(--sai-drift) ease-in-out infinite alternate;
}
.sai-lens::before { content:''; position:absolute; top: 11%; left: 17%; width: 36%; height: 18%;
  border-radius: 50%; background: rgba(255,255,255,0.9); filter: blur(5px); transform: rotate(-20deg); }
.sai-lens::after { content:''; position:absolute; bottom: 7%; left: 30%; width: 40%; height: 12%;
  border-radius: 50%; background: rgba(220,104,67,0.30); filter: blur(9px); }
.sai-lens.far  { filter: blur(5px);   opacity: .6; }
.sai-lens.mid  { filter: blur(1.5px); opacity: .85; }
.sai-lens.near { opacity: 1; }
@keyframes sai-drift { from { transform: translateY(0); } to { transform: translateY(-26px); } }
.sai-lens.l1 { width: 150px; height: 150px; top: 9%;  right: 6%;  --sai-drift: 17s; }
.sai-lens.l2 { width: 64px;  height: 64px;  top: 24%; left: 4%;   --sai-drift: 13s; }
.sai-lens.l3 { width: 96px;  height: 96px;  top: 47%; right: 12%; --sai-drift: 21s; }
.sai-lens.l4 { width: 42px;  height: 42px;  top: 66%; left: 9%;   --sai-drift: 11s; }
.sai-lens.l5 { width: 210px; height: 210px; bottom: -60px; right: 30%; --sai-drift: 24s; }
.sai-page { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto;
  padding: 116px clamp(20px, 4vw, 48px) 88px; }
.sai-page.no-dock { padding-top: 64px; }
.sai-pane {
  background: var(--sai-glass);
  backdrop-filter: blur(var(--sai-glass-blur)) saturate(var(--sai-glass-saturate));
  -webkit-backdrop-filter: blur(var(--sai-glass-blur)) saturate(var(--sai-glass-saturate));
  border: 1px solid var(--sai-glass-edge);
  box-shadow: var(--sai-pane-shadow);
}
.sai-streak { position: relative; overflow: hidden; isolation: isolate; }
.sai-streak::before { content:''; position:absolute; z-index: -1; inset: 0; border-radius: inherit; pointer-events:none;
  background: linear-gradient(115deg, transparent 120px, rgba(255,255,255,0.34) 360px, transparent 600px); }
.sai-tile { background: var(--sai-glass-tile); border: 1px solid rgba(255,255,255,0.7);
  border-radius: var(--sai-radius-tile); box-shadow: inset 0 1px 0 rgba(255,255,255,0.85);
  padding: 22px 26px; }
.sai-tile > :first-child { margin-top: 0; }
.sai-tile > :last-child { margin-bottom: 0; }
@media (max-width: 720px) { .sai-tile { padding: 18px 20px; } }
.sai-widget { padding: 36px; border-radius: var(--sai-radius-window); margin-bottom: 34px; position: relative; }
.sai-widget > h3, .sai-w-title { font-size: var(--sai-fs-h2); font-weight: var(--sai-fw-medium);
  letter-spacing: var(--sai-ls-heading); line-height: 1.15; margin-bottom: 4px; }
.sai-w-sub { color: var(--sai-ink-2); font-size: var(--sai-fs-sub); margin-bottom: 26px; }
.sai-w-note { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--sai-rule-soft);
  color: var(--sai-ink-2); font-size: 14.5px; }
.sai-w-note strong { color: var(--sai-ink-90); font-weight: var(--sai-fw-bold); }
.sai-display { font-size: var(--sai-fs-display); font-weight: var(--sai-fw-medium);
  letter-spacing: var(--sai-ls-display); line-height: var(--sai-lh-display); max-width: 21ch; }
.sai-display em, .sai-h1 em { font-style: normal; color: var(--sai-accent); }
.sai-lede { margin-top: 18px; font-size: 19px; color: var(--sai-ink-2); max-width: 56ch; }
.sai-lede b { color: var(--sai-ink-90); font-weight: var(--sai-fw-bold); }
.sai-port { display: inline-flex; align-items: center; gap: 11px; margin-bottom: 10px; }
.sai-port .disc { width: 26px; height: 26px; border-radius: 50%; flex: none;
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.2) 30%, transparent 55%),
    radial-gradient(circle at 50% 80%, rgba(220,104,67,0.5) 0%, transparent 60%),
    linear-gradient(180deg, #F7E7DA 0%, #F2CFB8 100%);
  border: 1.5px solid rgba(255,255,255,0.95);
  box-shadow: inset 0 1px 2px rgba(255,255,255,0.9), inset 0 -2px 4px rgba(220,104,67,0.25), 0 4px 10px rgba(112,62,40,0.18); }
.sai-port .ptext { font-family: var(--sai-font-label); font-size: var(--sai-fs-label); font-weight: var(--sai-fw-label);
  letter-spacing: var(--sai-ls-label); text-transform: uppercase; color: var(--sai-accent); }
.sai-port.on-night .disc {
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.06) 30%, transparent 55%),
    radial-gradient(circle at 50% 82%, rgba(255,142,118,0.55) 0%, transparent 62%),
    linear-gradient(180deg, #322734 0%, #100C0E 100%);
  border-color: rgba(255,255,255,0.35);
  box-shadow: inset 0 1px 2px rgba(255,255,255,0.3), 0 4px 10px rgba(0,0,0,0.35), 0 0 14px rgba(255,142,118,0.25); }
.sai-port.on-night .ptext { color: var(--sai-accent-night); }
.sai-stamp { position: relative; display: inline-block; font-family: var(--sai-font-label); font-size: 13.5px;
  font-weight: var(--sai-fw-label); letter-spacing: .07em; text-transform: uppercase; padding: 8px 14px; color: var(--sai-accent); }
.sai-stamp::before { content:''; position:absolute; top:0; left:0; width: 12px; height: 12px; border-top: 2px solid currentColor; border-left: 2px solid currentColor; }
.sai-stamp::after  { content:''; position:absolute; bottom:0; right:0; width: 12px; height: 12px; border-bottom: 2px solid currentColor; border-right: 2px solid currentColor; }
.sai-stamp.on-night { color: var(--sai-accent-night); }
.sai-stamp.corner { position: absolute; top: 26px; right: 28px; }
.sai-flag { display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--sai-font-label); font-size: 14px; font-weight: var(--sai-fw-label); letter-spacing: .01em;
  color: var(--sai-ink-90); padding: 6px 14px 6px 8px; border-radius: var(--sai-radius-flag);
  background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.95);
  box-shadow: inset 0 1px 0 #fff, 0 4px 12px rgba(112,62,40,0.10); white-space: nowrap; }
.sai-flag .tick { width: 4px; align-self: stretch; border-radius: 2px; background: var(--sai-accent); }
ul.sai-bullets { list-style: none; }
ul.sai-bullets li { position: relative; padding: 7px 0 7px 30px; }
ul.sai-bullets li b { color: var(--sai-ink-90); font-weight: var(--sai-fw-bold); }
ul.sai-bullets li::before { content:''; position:absolute; left: 0; top: 10px; width: 15px; height: 15px; border-radius: 50%;
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.25) 42%, transparent 62%),
    radial-gradient(circle at 50% 86%, rgba(220,104,67,0.5) 0%, transparent 62%),
    linear-gradient(180deg, #F7E7DA 0%, #F2CFB8 100%);
  border: 1px solid rgba(255,255,255,0.92);
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.9), inset 0 -1.5px 3px rgba(220,104,67,0.3), 0 3px 7px rgba(112,62,40,0.18); }
.sai-status { display:inline-flex; align-items:stretch; border:1px solid var(--sai-rule);
  border-radius: var(--sai-radius-chip); overflow:hidden; background: rgba(255,255,255,0.8); }
.sai-status .kw { font-family: var(--sai-font-label); font-size: 14px; font-weight: var(--sai-fw-label);
  letter-spacing: var(--sai-ls-label); text-transform: uppercase; padding: 10px 15px; display:flex; align-items:center; }
.sai-status .detail { font: 500 15px var(--sai-font-sans); color: var(--sai-ink-90); padding: 10px 16px;
  border-left: 1px solid var(--sai-rule); display:flex; align-items:center; }
.sai-status.good .kw { color: var(--sai-status-good); background: var(--sai-status-good-tint); }
.sai-status.warn .kw { color: var(--sai-status-warn); background: var(--sai-status-warn-tint); }
.sai-status.bad  .kw { color: var(--sai-status-bad);  background: var(--sai-status-bad-tint); }
.sai-chips { display: flex; flex-wrap: wrap; gap: 12px; }
.sai-dock { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); z-index: 10;
  display: flex; align-items: center; gap: 22px; padding: 12px 22px; border-radius: var(--sai-radius-pill);
  background: rgba(255,255,255,0.62);
  backdrop-filter: blur(26px) saturate(1.6); -webkit-backdrop-filter: blur(26px) saturate(1.6);
  border: 1px solid rgba(255,255,255,0.9);
  box-shadow: 0 12px 36px rgba(112,62,40,0.16), inset 0 1px 0 #fff; white-space: nowrap; }
.sai-dock .mark { width: 27px; height: 27px; display: block; }
.sai-dock .word { font-size: 17.5px; font-weight: var(--sai-fw-medium); letter-spacing: -0.01em; }
.sai-dock nav { display: flex; gap: 6px; }
.sai-dock nav a { font-family: var(--sai-font-label); font-size: 14px; font-weight: var(--sai-fw-label);
  letter-spacing: .04em; text-transform: uppercase; text-decoration: none; color: var(--sai-ink-2);
  padding: 8px 14px; border-radius: var(--sai-radius-pill); transition: all var(--sai-dur-base) var(--sai-ease); }
.sai-dock nav a:hover { color: var(--sai-ink); background: rgba(255,255,255,0.75); }
.sai-dock nav a.on { color: #fff; background: var(--sai-ink); }
@media (max-width: 720px) { .sai-dock nav { display: none; } }
.sai-btn { display:inline-block; text-decoration:none; cursor: pointer; border: none;
  font: 500 14.5px var(--sai-font-sans); border-radius: var(--sai-radius-pill); padding: 14px 26px;
  transition: all var(--sai-dur-base) var(--sai-ease); }
.sai-btn.primary { background: var(--sai-ink); color: #fff; box-shadow: 0 8px 20px rgba(23,19,16,0.2); }
.sai-btn.primary:hover { background: var(--sai-accent); transform: translateY(-2px); box-shadow: 0 12px 26px rgba(220,104,67,0.35); }
.sai-btn.ghost { color: var(--sai-ink); background: rgba(255,255,255,0.62); border: 1px solid var(--sai-glass-edge);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9); }
.sai-btn.ghost:hover { background: rgba(255,255,255,0.8); transform: translateY(-2px); }
.sai-footer { margin-top: 60px; display:flex; justify-content:space-between; align-items:center; gap: 20px; flex-wrap: wrap; }
.sai-footer .lockup { display:flex; align-items:center; gap: 12px; }
.sai-footer .lockup .mark { width: 25px; height: 25px; }
.sai-footer .lockup .word { font-size: 16.5px; font-weight: var(--sai-fw-medium); }
.sai-footer .meta { font-family: var(--sai-font-label); font-size: 14px; font-weight: var(--sai-fw-label);
  letter-spacing: var(--sai-ls-label); text-transform: uppercase; color: var(--sai-ink-2); }
section.sai-night {
  border-radius: var(--sai-radius-window); padding: 36px; margin-bottom: 34px; color: var(--sai-cream);
  background: var(--sai-night);
  border: 1px solid var(--sai-nglass-edge);
  box-shadow: var(--sai-npane-shadow);
  position: relative; overflow: hidden;
}
section.sai-night .sai-ember { position:absolute; width: 380px; height: 380px; border-radius: 50%; filter: blur(90px);
  background: var(--sai-accent); opacity: .2; top: -120px; right: -80px; pointer-events: none; }
section.sai-night .sai-ember.left { top: auto; right: auto; bottom: -140px; left: -100px; opacity: .15; }
section.sai-night > h3, section.sai-night .sai-w-title { color: var(--sai-cream); }
section.sai-night .sai-w-sub { color: var(--sai-cream-2); }
section.sai-night .sai-w-note { color: var(--sai-cream-2); border-top-color: var(--sai-nrule-soft); }
section.sai-night .sai-w-note strong { color: var(--sai-cream); }
section.sai-night .sai-tile { background: var(--sai-nglass-tile); border-color: var(--sai-nglass-edge);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.07); }
section.sai-night ul.sai-bullets li b { color: var(--sai-cream); }
.sai-day-window { position: relative; border-radius: 20px; padding: 28px; background: var(--sai-daysheet); color: var(--sai-ink);
  border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 18px 44px rgba(0,0,0,0.4), inset 0 1px 0 #fff; }
.sai-day-window .cap { font-family: var(--sai-font-label); font-size: var(--sai-fs-label); font-weight: var(--sai-fw-label);
  letter-spacing: var(--sai-ls-label); text-transform: uppercase; color: var(--sai-accent); margin-bottom: 12px; }
.sai-float-stat { position: absolute; right: 28px; bottom: -34px; z-index: 3;
  display: flex; gap: 26px; padding: 22px 30px; border-radius: var(--sai-radius-card);
  background: var(--sai-glass-strong);
  backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
  border: 1px solid rgba(255,255,255,0.95); box-shadow: var(--sai-float-shadow); }
.sai-float-stat .n { font-size: 34px; font-weight: var(--sai-fw-medium); letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.sai-float-stat .n em { font-style: normal; color: var(--sai-accent); }

<script>
/* Ticks: read from the page server on load, saved to it on every change. localStorage holds a copy, so the
   page still works opened as a file or with the server down, and offline ticks catch up on the next load. */
(function () {
  'use strict';
  var meta = document.querySelector('meta[name="sai-checklist"]');
  var id = meta ? meta.getAttribute('content') : '';
  var KEY = 'checklist:' + id;
  var API = '/api/checklist/' + encodeURIComponent(id);
  var list = document.getElementById('ck-list');
  var progress = document.getElementById('ck-progress');
  var saveEl = document.getElementById('ck-save');
  var copyBtn = document.getElementById('ck-copy');
  var titleEl = document.querySelector('.ck-title');
  var intro = document.querySelector('.ck-intro');
  var rows = Array.prototype.slice.call(list.querySelectorAll('.ck-item'));
  var boxes = rows.map(function (li) { return li.querySelector('input[type="checkbox"]'); });

  if (intro && !intro.textContent.trim()) intro.hidden = true;

  function itemId(li) { return li.getAttribute('data-id') || (li.querySelector('input') || {}).id || ''; }
  function textOf(el) { return el ? el.textContent.replace(/\s+/g, ' ').trim() : ''; }
  function ticksNow() {
    var t = {};
    rows.forEach(function (li, i) { if (boxes[i]) t[itemId(li)] = boxes[i].checked; });
    return t;
  }
  function apply(t) {
    if (t) rows.forEach(function (li, i) { var k = itemId(li); if (boxes[i] && Object.prototype.hasOwnProperty.call(t, k)) boxes[i].checked = !!t[k]; });
    count();
  }
  function count() {
    var done = boxes.filter(function (b) { return b && b.checked; }).length;
    progress.textContent = done + ' of ' + boxes.length + ' done';
    progress.classList.toggle('all', boxes.length > 0 && done === boxes.length);
  }
  function state(ok) {
    saveEl.textContent = ok ? 'Saved' : 'Saved in this browser only';
    saveEl.classList.toggle('off', !ok);
  }
  function readLocal() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  function writeLocal(t, pending) {
    try { localStorage.setItem(KEY, JSON.stringify({ ticks: t, pending: pending, updated: new Date().toISOString() })); } catch (e) {}
  }

  /* One save in flight at a time; a change made meanwhile sends the newest full map right after. */
  var sentMeta = false, inFlight = false, again = false;
  function post() {
    if (inFlight) { again = true; return; }
    inFlight = true; again = false;
    var body = { ticks: ticksNow() };
    if (!sentMeta) {
      body.title = textOf(titleEl);
      body.items = rows.map(function (li) { return { id: itemId(li), text: textOf(li.querySelector('.ck-text')) }; });

    writeLocal(ticksNow(), true);
    post();
